<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь бронирований в реальном времени</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Подключаем Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Календарь бронирований</h1>
            <p>Изменения видны на всех устройствах в реальном времени</p>
            <div class="controls">
                <button id="prevMonth">◀ Предыдущий месяц</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth">Следующий месяц ▶</button>
            </div>
        </header>

        <div class="legend">
            <div class="legend-item">
                <div class="day available"></div>
                <span>Свободно</span>
            </div>
            <div class="legend-item">
                <div class="day booked"></div>
                <span>Забронировано</span>
            </div>
            <div class="legend-item">
                <div class="day today"></div>
                <span>Сегодня</span>
            </div>
        </div>

        <div class="calendar">
            <div class="weekdays">
                <div>Пн</div>
                <div>Вт</div>
                <div>Ср</div>
                <div>Чт</div>
                <div>Пт</div>
                <div>Сб</div>
                <div>Вс</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>

        <div class="stats">
            <p>Свободных дней: <span id="freeDays">0</span></p>
            <p>Забронированных дней: <span id="bookedDays">0</span></p>
            <p>Обновлено: <span id="lastUpdate">-</span></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
